<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #fff; }
        .menu { background: #fff; border-bottom: 1px solid #000; padding: 2px 5px; font-family: 'MS Sans Serif', sans-serif; font-size: 13px; }
        .menu span { margin-right: 15px; cursor: default; }
        .menu span::first-letter { text-decoration: underline; }
        textarea { flex-grow: 1; border: none; outline: none; resize: none; font-family: '굴림체', monospace; font-size: 14px; padding: 5px; }
    </style>
</head>
<body>
    <div class="menu">
        <span>File</span><span>Edit</span><span>Search</span><span>Help</span>
    </div>
    <textarea spellcheck="false"></textarea>
</body>
</html>
